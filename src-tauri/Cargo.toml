[package]
name = "rollcat-md"
version = "0.5.4"
description = "rollcat-md — a lightweight Markdown reader and editor for Windows and Android."
authors = ["sonicacd"]
license = "Apache-2.0"
repository = "https://github.com/sonicacd/rollcatmd"
homepage = "https://github.com/sonicacd/rollcatmd"
edition = "2021"

[lib]
name = "rollcat_md_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["image-png"] }
base64 = "0.22"
percent-encoding = "2"
serde_json = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = { version = "=2.6.0", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Registry", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
